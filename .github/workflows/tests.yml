name: Tests

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # Browser assets are checked in; the dice dependency's postinstall is interactive.
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install server dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Run server and client tests
        run: npm test
